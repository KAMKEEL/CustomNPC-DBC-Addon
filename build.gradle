//version: 1707058017
plugins {
    id 'com.gtnewhorizons.gtnhconvention'
    id 'dts.typescript-generator'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

var BUILD_USING_CNPC_SOURCE = !(project.hasProperty("useCNPCJar") && project.useCNPCJar == 'true')

if (BUILD_USING_CNPC_SOURCE)
    apply from: 'gradle.handleCNPCSubmoduleInjection.groovy'

group= "kamkeel.npcdbc"
version = "1.2.1"
group= "kamkeel.npcdbc"
archivesBaseName = "npcdbc"

def findJarBySubstring = { part ->
    def matches = configurations.runtimeClasspath.filter { it.name.contains(part) }

    if (matches.isEmpty()) {
        throw new GradleException("Cannot find JAR containing '${part}' in runtimeClasspath")
    }

    return matches.first() // valid in old Gradle
}

tasks.runServer { setWorkingDir(file("run/server")) }

tasks.named("runClient").configure {
    def agent = findJarBySubstring("unimixins")
    extraJvmArgs.addAll("-javaagent:${agent.absolutePath}")

}

// ============================================================================
// TypeScript Definition Generation Task
// Generates .d.ts files from Java API sources for scripting IDE support
// ============================================================================
// TypeScript plugin is applied above in the main plugins block

tasks.named("generateTypeScriptDefinitions").configure {
    sourceDirectories = ['src/main/java']
    outputDirectory = "src/main/resources/assets/${project.property("modId")}/api"
    apiPackages = ['kamkeel.npcdbc.api'] as Set
    cleanOutputFirst = true  // Clean old generated files before regenerating
    patchesDirectory = "dts-patches"
    // Limit enrichment scanning to actual implementation packages (exclude kamkeel.npcdbc.api)
    implementationPackages = [
        'kamkeel.npcdbc.controllers',
        'kamkeel.npcdbc.data',
        'kamkeel.npcdbc.scripted',
        'kamkeel.npcdbc.client.utils'
    ] as Set
}
processResources.dependsOn generateTypeScriptDefinitions
sourcesJar.dependsOn generateTypeScriptDefinitions

javadoc {
    options.encoding     = 'UTF-8'
    options.charSet      = 'UTF-8'
    options.docEncoding  = 'UTF-8'
//    options.addStringOption('Xdoclint:none', '-quiet')

    options.stylesheetFile = file('.github/javadoc/javadoc-theme.css')
    options.header = file('.github/javadoc/javadoc-header.html').text.replaceAll('\\s+', ' ').trim()

    options.addBooleanOption('-allow-script-in-comments', true)
    options.footer = file('.github/javadoc/javadoc-footer.html').text.replaceAll('\\s+', ' ').trim()


    include 'kamkeel/npcdbc/api/**'

    options.links('https://docs.oracle.com/en/java/javase/11/docs/api/')

    // Link to CNPC+ javadoc. The URL and local element-list location are
    // supplied by the CI workflow via Gradle properties:
    //   -PcnpcDocUrl=https://kamkeel.github.io/CustomNPC-Plus/experimental/dev
    //   -PcnpcDocElementList=build/cnpc-element-list
    // Falls back to the submodule's docs/ folder for local builds.
    def cnpcUrl = project.hasProperty('cnpcDocUrl')
        ? project.cnpcDocUrl
        : 'https://kamkeel.github.io/CustomNPC-Plus/'
    def cnpcElementList = project.hasProperty('cnpcDocElementList')
        ? project.cnpcDocElementList
        : "${project.rootDir}/CustomNPC-Plus/docs"
    options.linksOffline(cnpcUrl, cnpcElementList)

    javadocTool = javaToolchains.javadocToolFor {
        languageVersion = JavaLanguageVersion.of(11)
    }
}
